name: Generate Baseline Profile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gmd = Gradle Managed Device emulator; connected = one physical USB device"
        required: true
        type: choice
        options:
          - gmd
          - connected
        default: gmd
      create_pr:
        description: Create or update a PR with the generated profiles
        required: true
        type: boolean
        default: true
      runner_labels_json:
        description: >-
          JSON array of self-hosted runner labels. Examples:
          ["self-hosted","linux","android"] or ["self-hosted","macOS","android-physical"]
        required: true
        type: string
        default: '["self-hosted","linux","android"]'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-profile-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK (preinstalled preferred)
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=(
            "${ANDROID_HOME:-}"
            "${ANDROID_SDK_ROOT:-}"
            "$HOME/Android/Sdk"
            "$HOME/Library/Android/sdk"
            "/usr/local/lib/android/sdk"
          )
          SDK=""
          for candidate in "${CANDIDATES[@]}"; do
            if [[ -n "$candidate" && -x "$candidate/platform-tools/adb" ]]; then
              SDK="$candidate"
              break
            fi
          done
          if [[ -z "$SDK" ]]; then
            echo "::error::Android SDK not found. Install SDK + platform-tools on the self-hosted runner and set ANDROID_HOME."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Using Android SDK: $SDK"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
          else
            echo "sdkmanager not on PATH; assuming licenses already accepted on the runner."
          fi

      - name: Enable KVM (Linux GMD)
        if: ${{ inputs.mode == 'gmd' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is missing. Self-hosted Linux runners need nested virt / KVM for GMD."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chown root:"$(id -gn)" /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Validate attached physical Android device
        if: ${{ inputs.mode == 'connected' }}
        shell: bash
        run: bash scripts/ci/check-android-device.sh

      - name: Setup GMD system image
        if: ${{ inputs.mode == 'gmd' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :baselineprofile:pixel6Api34Setup \
            --info \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Generate Baseline Profile (GMD)
        if: ${{ inputs.mode == 'gmd' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:generateBaselineProfile \
            -Pbaselineprofile.useConnectedDevices=false \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            -Pandroid.experimental.androidTest.numManagedDeviceShards=1 \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
            --stacktrace

      - name: Generate Baseline Profile (connected device)
        if: ${{ inputs.mode == 'connected' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:generateBaselineProfile \
            -Pbaselineprofile.useConnectedDevices=true \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            --stacktrace

      - name: Verify generated profiles
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_DIR="app/src/main/generated/baselineProfiles"
          BASELINE="$PROFILE_DIR/baseline-prof.txt"
          if [[ ! -s "$BASELINE" ]]; then
            echo "::error::Missing or empty Baseline Profile: $BASELINE"
            exit 1
          fi
          echo "Generated files:"
          ls -lah "$PROFILE_DIR"
          wc -l "$PROFILE_DIR"/*.txt

      - name: Upload generated profiles
        uses: actions/upload-artifact@v4
        with:
          name: android-baseline-profiles-${{ inputs.mode }}-${{ github.run_number }}
          path: app/src/main/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update Baseline Profile PR
        if: ${{ inputs.create_pr }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-baseline-profile
          delete-branch: true
          commit-message: "perf: regenerate Android Baseline Profiles (${{ inputs.mode }})"
          title: "perf: update Android Baseline Profiles"
          body: |
            Regenerated via `:app:generateBaselineProfile` on a self-hosted runner.

            - Mode: `${{ inputs.mode }}`
            - Review profile diffs before merging
          add-paths: |
            app/src/main/generated/baselineProfiles/*.txt
